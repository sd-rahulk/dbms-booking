<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1400" viewBox="0 0 2200 1400">
  <rect width="2200" height="1400" fill="#F7F5F0"/><style>text{font-family:Arial,sans-serif;fill:#171717} .t{font-weight:700;letter-spacing:2px} .k{fill:#D99A38} .box{fill:#FBFAF7;stroke:#171717;stroke-width:2} .line{stroke:#858585;stroke-width:2} .rel{font-size:20px;fill:#858585}</style>
  <text x="90" y="75" font-size="38" class="t">AERIDE / ER DIAGRAM — CHEN NOTATION</text><text x="90" y="112" font-size="17" fill="#858585">12 original relations · safe physical identifiers · implicit cardinalities labeled</text>
  <g transform="translate(90 190)"><rect class="box" width="300" height="150"/><text x="20" y="38" font-size="25" class="t">USER</text><text x="20" y="75" font-size="18" class="k">PK  User_ID</text><text x="20" y="105" font-size="17">First_Name · Last_Name</text><text x="20" y="130" font-size="17">Email (U, NN)</text></g>
  <g transform="translate(90 560)"><rect class="box" width="300" height="135"/><text x="20" y="38" font-size="25" class="t">DRIVER</text><text x="20" y="75" font-size="18" class="k">PK  Driver_ID</text><text x="20" y="105" font-size="17">First_Name · Last_Name</text><text x="20" y="130" font-size="17">Email (U, NN)</text></g>
  <g transform="translate(780 410)"><rect class="box" width="380" height="220"/><text x="20" y="38" font-size="25" class="t">TRIP</text><text x="20" y="75" font-size="18" class="k">PK  Trip_ID</text><text x="20" y="108" font-size="17">FK User_ID · FK Policy_ID</text><text x="20" y="138" font-size="17">Pickup_Location · Drop_Location</text><text x="20" y="168" font-size="17">Booking_Date · Booking_Time</text><text x="20" y="198" font-size="17">[physical: status, fare, distance]</text></g>
  <g transform="translate(1510 170)"><rect class="box" width="330" height="145"/><text x="20" y="38" font-size="25" class="t">FARE_POLICY</text><text x="20" y="75" font-size="18" class="k">PK  Policy_ID</text><text x="20" y="108" font-size="17">Vehicle_Type · Base_Fare</text><text x="20" y="135" font-size="17">Per_Km_Rate</text></g>
  <g transform="translate(1510 490)"><rect class="box" width="330" height="165"/><text x="20" y="38" font-size="25" class="t">VEHICLE</text><text x="20" y="75" font-size="18" class="k">PK  Vehicle_ID</text><text x="20" y="108" font-size="17">FK Driver_ID · Type · Model</text><text x="20" y="138" font-size="17">Capacity (&gt; 0)</text></g>
  <g transform="translate(1510 850)"><rect class="box" width="330" height="155"/><text x="20" y="38" font-size="25" class="t">PAYMENT</text><text x="20" y="75" font-size="18" class="k">PK  Payment_ID</text><text x="20" y="108" font-size="17">FK User_ID · Driver_ID · Trip_ID</text><text x="20" y="138" font-size="17">Date · Method · Amount</text></g>
  <g transform="translate(800 980)"><rect class="box" width="300" height="145"/><text x="20" y="38" font-size="25" class="t">REVIEW</text><text x="20" y="75" font-size="18" class="k">PK  Review_ID</text><text x="20" y="108" font-size="17">FK Trip_ID · Rating 1–5</text><text x="20" y="135" font-size="17">Comment</text></g>
  <g transform="translate(140 980)"><rect class="box" width="300" height="135"/><text x="20" y="38" font-size="25" class="t">USER_PHONE</text><text x="20" y="75" font-size="18" class="k">PK  (User_ID, Phone_Number)</text><text x="20" y="108" font-size="17">multivalued attribute</text></g>
  <g transform="translate(1480 1080)"><rect class="box" width="360" height="135"/><text x="20" y="38" font-size="25" class="t">VEHICLE_DOCUMENT</text><text x="20" y="75" font-size="18" class="k">PK  Document_ID · FK Vehicle_ID</text><text x="20" y="108" font-size="17">Issue_Date · Expiry_Date</text></g>
  <g transform="translate(1940 500)"><rect class="box" width="190" height="130"/><text x="18" y="38" font-size="20" class="t">DRIVER_PHONE</text><text x="18" y="70" font-size="15" class="k">PK (Driver_ID,</text><text x="18" y="94" font-size="15" class="k">Phone_Number)</text><text x="18" y="118" font-size="14">multivalued</text></g>
  <g transform="translate(1950 170)"><rect class="box" width="190" height="130"/><text x="18" y="38" font-size="20" class="t">EMERGENCY</text><text x="18" y="70" font-size="15" class="k">PK Contact_ID</text><text x="18" y="94" font-size="15">FK User_ID · Name</text><text x="18" y="118" font-size="15">Phone_Number</text></g>
  <line class="line" x1="390" y1="265" x2="780" y2="500"/><text class="rel" x="500" y="350">books (1:N)</text>
  <line class="line" x1="390" y1="625" x2="780" y2="540"/><text class="rel" x="495" y="595">assigned via (M:N)</text>
  <line class="line" x1="1160" y1="470" x2="1510" y2="250"/><text class="rel" x="1245" y="345">uses (N:1)</text>
  <line class="line" x1="1160" y1="555" x2="1510" y2="565"/><text class="rel" x="1260" y="540">served by</text>
  <line class="line" x1="1160" y1="610" x2="1510" y2="920"/><text class="rel" x="1255" y="780">paid by</text>
  <line class="line" x1="950" y1="630" x2="950" y2="980"/><text class="rel" x="970" y="805">receives</text>
  <line class="line" x1="1660" y1="655" x2="1660" y2="1080"/><text class="rel" x="1680" y="845">has (1:N)</text>
  <line class="line" x1="390" y1="265" x2="1950" y2="235"/><text class="rel" x="1850" y="215">has contacts</text>
  <line class="line" x1="390" y1="625" x2="1940" y2="565"/><text class="rel" x="1860" y="545">has numbers</text>
  <text x="90" y="1325" font-size="17" fill="#858585">Assumption: a passenger may book many trips; a trip uses one fare policy; assignments are modeled as M:N for reassignment history, with one active driver operationally.</text>
</svg>
